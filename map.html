<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<link rel="stylesheet" href="assets/css/style.css" />

<title>Elco van Rijswijk</title>
<link rel="icon" href="assets/photos/favicon.ico" type="image/x-icon">

</head>
<body class="map-page">

  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">EvR</span></a>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="assets/resume/resume.pdf" target="_blank" rel="noopener">Resume</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="map.html" class="active" aria-current="page">Travel Map</a>
    </nav>
  </header>

<main class="map-layout">
  <aside class="map-sidebar">
    <h1>Travel <span class="gradient-text">Map</span></h1>
    <p class="sidebar-lede">Some of the cool places I've visited.</p>
    <div class="map-stats">
      <div><strong id="stat-places">0</strong><span>places</span></div>
      <div><strong id="stat-photos">0</strong><span>photos</span></div>
    </div>
    <input type="search" id="place-search" class="place-search" placeholder="Search places…" aria-label="Search places" />
    <ul class="place-list" id="place-list"></ul>
  </aside>

  <div class="map-wrap">
    <div id="map" role="application" aria-label="Interactive world map of visited places"></div>
  </div>
</main>

<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" type="button" aria-label="Close">✕</button>
  <button class="lb-prev" type="button" aria-label="Previous photo">‹</button>
  <figure class="lb-figure">
    <img id="lb-image" alt="" />
    <figcaption id="lb-caption"></figcaption>
  </figure>
  <button class="lb-next" type="button" aria-label="Next photo">›</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/map.js"></script>
</body>
</html>
